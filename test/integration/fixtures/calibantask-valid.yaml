# Minimal schema-valid CalibanTask (post-#11 schema): references a Workspace by
# name (workspace-valid.yaml → l1-valid-ws) and carries the required task.prompt.
# Used by the L1 CRD round-trip (schema only) and the L3 reconcile gate (which
# applies the Workspace first, then this, and drives it to a running sandbox).
apiVersion: caliban.caliban-ai.dev/v1alpha1
kind: CalibanTask
metadata:
  name: l1-valid
spec:
  workspaceRef:
    name: l1-valid-ws
  task:
    prompt: "hello from the caliban integration tests"
