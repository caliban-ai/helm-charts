# Invalid on purpose: has a valid workspaceRef but spec.task omits the required
# `prompt`. The API server must REJECT this on create — proves the CRD schema has
# teeth (post-#11 schema: workspaceRef required, task.prompt required).
apiVersion: caliban.caliban-ai.dev/v1alpha1
kind: CalibanTask
metadata:
  name: l1-invalid
spec:
  workspaceRef:
    name: l1-valid-ws
  task: {}
