name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: leakage guard (charts must be cluster-agnostic)
        run: bash scripts/check-no-cluster-leakage.sh
      - name: helm lint (leaf charts)
        run: |
          for c in charts/caliban-crds charts/agent-sandbox charts/gonzalo charts/prospero charts/caliban-operator; do
            echo "== lint $c =="; helm lint "$c"
          done
      - name: helm lint (umbrella)
        run: |
          helm dependency build charts/caliban-system
          helm lint charts/caliban-system
      - name: kubeconform (rendered manifests)
        run: |
          curl -sSLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tgz -C /tmp kubeconform
          for c in charts/agent-sandbox charts/gonzalo charts/prospero charts/caliban-operator; do
            echo "== kubeconform $c =="
            helm template "$c" | /tmp/kubeconform -strict -summary -
          done
          # CRD chart: kubeconform's default schema set has no meta-schema for the
          # CustomResourceDefinition kind itself, so allow that one to be skipped
          # (-ignore-missing-schemas) while still strictly validating everything else.
          echo "== kubeconform charts/caliban-crds (CRDs) =="
          helm template charts/caliban-crds | /tmp/kubeconform -strict -ignore-missing-schemas -summary -
