name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: leakage guard (charts must be cluster-agnostic)
        run: bash scripts/check-no-cluster-leakage.sh
      - name: helm lint (leaf charts)
        run: |
          for c in charts/caliban-crds charts/agent-sandbox charts/gonzalo charts/prospero charts/caliban-operator; do
            echo "== lint $c =="; helm lint "$c"
          done
      - name: helm lint (umbrella)
        run: |
          helm dependency build charts/caliban-system
          helm lint charts/caliban-system
      - name: kubeconform (rendered manifests)
        run: |
          curl -sSLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tgz -C /tmp kubeconform
          for c in charts/agent-sandbox charts/gonzalo charts/prospero charts/caliban-operator; do
            echo "== kubeconform $c =="
            helm template "$c" | /tmp/kubeconform -strict -summary -
          done
          # CRD chart: kubeconform's default schema set has no meta-schema for the
          # CustomResourceDefinition kind itself, so allow that one to be skipped
          # (-ignore-missing-schemas) while still strictly validating everything else.
          echo "== kubeconform charts/caliban-crds (CRDs) =="
          helm template charts/caliban-crds | /tmp/kubeconform -strict -ignore-missing-schemas -summary -

  integration:
    # Level 1 live-cluster test: proves the charts APPLY to a real API server,
    # the CalibanTask CRD round-trips, and the operator RBAC is sufficient.
    # Needs no images and no registry secrets (never waits for pod Readiness).
    # See test/integration/README.md for the full test-tier rationale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: azure/setup-kubectl@v4
      - name: start k3s (no traefik/servicelb/metrics)
        run: |
          curl -sfL https://get.k3s.io | \
            INSTALL_K3S_EXEC="--disable=traefik --disable=servicelb --disable=metrics-server --write-kubeconfig-mode=644" sh -
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"
          until kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes 2>/dev/null | grep -q ' Ready'; do
            sleep 2
          done
      - name: level 1 integration test
        run: bash test/integration/level1.sh

  deploy-gate:
    # Level 2 deployability gate: installs the FULL umbrella (agent-sandbox +
    # gonzalo + prospero + operator + CRDs) on k3s and waits for every workload to
    # reach Ready. Green == the umbrella is safe to deploy to the k3s home cluster.
    # NON-BLOCKING for now (continue-on-error) — the caliban-ai ghcr images must be
    # anonymously pullable before this can pass. Drop continue-on-error to promote it
    # to a required gate once it is reliably green. See test/integration/README.md.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: azure/setup-kubectl@v4
      - name: start k3s (no traefik/servicelb/metrics)
        run: |
          curl -sfL https://get.k3s.io | \
            INSTALL_K3S_EXEC="--disable=traefik --disable=servicelb --disable=metrics-server --write-kubeconfig-mode=644" sh -
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"
          until kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes 2>/dev/null | grep -q ' Ready'; do
            sleep 2
          done
      - name: level 2 deployability gate
        run: bash test/integration/level2.sh
