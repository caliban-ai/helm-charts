# Generic, cluster-agnostic defaults ONLY.
# Supply environment-specific values (storageClass, ingress, secrets) via a
# SEPARATE PRIVATE overlay at deploy time:  helm install ... -f private-values.yaml
replicaCount: 1            # fs substrate = single writer; HA (multi-replica over
                           # an object store) is a follow-on — see chart README.
image:
  repository: ghcr.io/caliban-ai/gonzalo   # public image; override at deploy time
  tag: ""                  # defaults to .Chart.AppVersion when unset
  pullPolicy: IfNotPresent
imagePullSecrets: []       # e.g. [{ name: ghcr-pull }] when pulling private images
service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 50051
auth:
  # Namespace-scoped principals (gonzalo ADR 0015). Name an EXISTING Secret whose
  # `key` holds the principals TOML; the chart mounts it read-only and points
  # GONZALO_AUTH_FILE at it. Principals and tokens never go in values. Unset
  # name = auth off (open), the local default. See the chart README.
  existingSecret:
    name: ""
    key: principals.toml
persistence:               # fs substrate always provisions a PVC (not optional)
  storageClass: ""         # "" = cluster default
  size: 1Gi
  accessMode: ReadWriteOnce
env: {}                    # extra raw env vars (map of name: value)
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
