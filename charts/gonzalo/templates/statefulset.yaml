{{- if .Values.auth.token }}
{{- fail "gonzalo: auth.token was removed (a token in values ends up in git). Put a principals TOML in a Secret and set auth.existingSecret.name — see the chart README." }}
{{- end }}
{{- if and .Values.auth.existingSecret.name (not .Values.auth.existingSecret.key) }}
{{- fail "gonzalo: auth.existingSecret.key must name the Secret key holding the principals TOML" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gonzalo.fullname" . }}
  labels:
    {{- include "gonzalo.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gonzalo.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gonzalo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gonzalo.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gonzalo.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gonzalod
          image: {{ include "gonzalo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GONZALO_ROOT
              value: /data
            - name: GONZALO_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.service.httpPort }}"
            - name: GONZALO_GRPC_ADDR
              value: "0.0.0.0:{{ .Values.service.grpcPort }}"
            {{- if .Values.auth.existingSecret.name }}
            - name: GONZALO_AUTH_FILE
              value: /etc/gonzalo/auth/principals.toml
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
          # gonzalod has no HTTP health endpoint — probe the TCP port. A TCP
          # probe carries no token, so it stays unauthenticated with auth on.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.auth.existingSecret.name }}
            - name: auth
              mountPath: /etc/gonzalo/auth
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.auth.existingSecret.name }}
      volumes:
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.auth.existingSecret.key | quote }}
                path: principals.toml
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ {{ .Values.persistence.accessMode | quote }} ]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
