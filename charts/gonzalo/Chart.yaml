apiVersion: v2
name: gonzalo
description: Gonzalo persistence daemon (gonzalod) — part of the caliban-ai system
type: application
version: 0.3.1
appVersion: "0.7.0"   # v0.7.0: replicated deletion (tombstones, namespace reset, horizon collect; ADR 0021) and the fleet access-control record kinds Ariel stores (ADR 0022) — Ariel requires gonzalod >= 0.7.0. No daemon-facing chart change: no new required env, ports, or storage layout; the optional GONZALO_ANCESTOR_CAP (default 32) goes through `env`. UPGRADE EVERY GONZALO BINARY TOGETHER: a 0.6 binary that reads this store directly, or syncs against 0.7 data, can't see tombstones and copies deleted records back (and can't decode the fleet kinds). A 0.7 client against a 0.6 gonzalod fails replication reads loudly.
