apiVersion: v2
name: caliban-operator
description: caliban-operator (kube-rs) controller — reconciles CalibanTask into sandboxed caliband pods
type: application
version: 0.2.11
appVersion: "0.7.0"   # v0.7.0 = leader election on by default: the controller takes a coordination.k8s.io Lease before running either reconciler and returns to standby if it loses it, so replicas > 1 is a standby rather than two writers racing (#48). Needs the Lease RBAC this chart already ships (added in 0.2.10 ahead of the operator release) — without it the controller cannot acquire the Lease and will not start reconciling. Tunable via leaderElection.{enabled,leaseName,durationSeconds,graceSeconds}; POD_NAME is projected as the holder identity. Also: Workspace.spec.agentPolicy is now typed and projected to the agent instead of travelling as untyped env — permissionMode/autoAllow/noPermissions (#51) and noMcp/noHooks/noSkills/noSubAgent/strictKnownMarketplaces/enabledPlugins/blockedMarketplaces/parallelToolLimit (#87); CalibanTask.spec.model.name overrides the resolved provider's model for one task (#52); the sandbox pod runs as the agent's uid/gid with runAsNonRoot and fsGroup, so clones the agent writes are usable (#79); an invalid state.mode is refused at admission rather than at reconcile (#94). UPGRADE IMPACT — this release starts ENFORCING the unsupervised-policy gate: a Workspace setting permissionMode dontAsk/bypassPermissions or noPermissions WITHOUT agentPolicy.allowUnattended is refused fail-closed, where v0.6.0 ignored those fields entirely. Audit Workspaces for those settings before upgrading. Needs caliban-crds >= 0.2.9 or the API server prunes agentPolicy/model.name. Carries forward v0.6.0 = per-session permission posture: CalibanTask.spec.task.permissionPosture (supervised|unattended), admitted only under a Workspace whose agentPolicy.allowUnattended is true — otherwise the task fails closed with PostureNotPermitted before any pod is created (#80, operator ADR 0006). status.permissionPosture + a `Posture` printer column. caliband's flags/env and the provider credential env names come from caliban-contract, now 0.15.0 (#82, #95), no pod-spec change. Workspace write access authorizes unattended agents — treat it as privileged. Carries forward v0.5.0 = terminal phases from prospero's AgentsSettled condition (#37/#75), optional workspace egress allow-list (#58), spec.state storage settings + gonzalod tokenRef (#41/#53), Kubernetes Events (#56; needs the events RBAC in templates/rbac.yaml), sandbox CPU/memory resources (#50), configurable cluster DNS domain (#54), SSA status writes with conditions as a map-list (#64), reconcile/config/RBAC fixes. New env (CALIBAND_CPU_*/MEMORY_*, CALIBAN_CLUSTER_DOMAIN, CALIBAN_INGRESS_*) is optional with safe defaults. Needs caliban-crds >= 0.2.4. env.calibandImage is caliban 0.14.0 (see values.yaml).
