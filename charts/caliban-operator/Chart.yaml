apiVersion: v2
name: caliban-operator
description: caliban-operator (kube-rs) controller — reconciles CalibanTask into sandboxed caliband pods
type: application
version: 0.2.9
appVersion: "0.6.0"   # v0.6.0 = per-session permission posture: CalibanTask.spec.task.permissionPosture (supervised|unattended), admitted only under a Workspace whose agentPolicy.allowUnattended is true — otherwise the task fails closed with PostureNotPermitted before any pod is created (#80, operator ADR 0006). status.permissionPosture + a `Posture` printer column. caliband's flags/env and the provider credential env names now come from caliban-contract 0.14.0 (#82), no pod-spec change. Needs caliban-crds >= 0.2.5 or the API server prunes permissionPosture/agentPolicy. Workspace write access authorizes unattended agents — treat it as privileged. Carries forward v0.5.0 = terminal phases from prospero's AgentsSettled condition (#37/#75), optional workspace egress allow-list (#58), spec.state storage settings + gonzalod tokenRef (#41/#53), Kubernetes Events (#56; needs the events RBAC in templates/rbac.yaml), sandbox CPU/memory resources (#50), configurable cluster DNS domain (#54), SSA status writes with conditions as a map-list (#64), reconcile/config/RBAC fixes. New env (CALIBAND_CPU_*/MEMORY_*, CALIBAN_CLUSTER_DOMAIN, CALIBAN_INGRESS_*) is optional with safe defaults. Needs caliban-crds >= 0.2.4. env.calibandImage is caliban 0.14.0 (see values.yaml).
