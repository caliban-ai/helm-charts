# Generic, cluster-agnostic defaults ONLY.
# The operator is a controller (no inbound Service/Ingress); it watches CalibanTask
# CRs cluster-wide and creates Sandboxes/ServiceAccounts/NetworkPolicies.
# Supply environment-specific values via a SEPARATE PRIVATE overlay at deploy time:
#   helm install ... -f private-values.yaml

replicaCount: 1

image:
  repository: ghcr.io/caliban-ai/caliban-operator   # public image; overridable at deploy time
  tag: ""                 # defaults to .Chart.AppVersion when unset
  pullPolicy: IfNotPresent

# Private-registry pull secrets (names of pre-existing Secrets), supplied via overlay.
imagePullSecrets: []

serviceAccount:
  # Create the operator's ServiceAccount (the identity the ClusterRole binds to).
  create: true
  # Override the generated SA name (defaults to the chart fullname).
  name: ""

rbac:
  # Create the ClusterRole + ClusterRoleBinding the operator needs to watch
  # CalibanTasks and create Sandboxes/ServiceAccounts/NetworkPolicies. Required
  # for the operator to function; disable only to manage RBAC out-of-band.
  create: true

leaderElection:
  # Leader-election leases RBAC (namespaced Role/RoleBinding). OFF by default —
  # the current operator runs a single replica and does not yet elect a leader.
  # Enable together with replicaCount > 1 once the operator supports HA.
  enabled: false

# Environment the operator injects into the caliband pods it creates. These map to
# the operator's Settings (see caliban-operator ADR 0002). Neutral defaults only.
env:
  # CALIBAND_IMAGE: the caliband container image the operator runs in each Sandbox.
  calibandImage: "ghcr.io/caliban-ai/caliban:0.6.0"
  # CALIBAND_PORT: TCP+TLS port caliband listens on inside the pod.
  calibandPort: "8443"
  # CALIBAN_WORKSPACE_ROOT: workspace mount path in the pod.
  workspaceRoot: "/work"
  # CALIBAN_WORKSPACE_STORAGE: requested size of each task's workspace PVC.
  workspaceStorage: "10Gi"
  sessionTlsSecret: caliban-session-plane-tls
  sessionTokenSecret: caliban-session-plane-token
  sessionTokenKey: token

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
