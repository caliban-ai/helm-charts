{{- if eq .Values.fleetBackend "k8s" }}
# The K8sFleet backend (fleetBackend=k8s) reads and drives CalibanTask CRs in this
# namespace via prosperod's in-cluster ServiceAccount token. Namespaced Role — the
# backend is scoped to PROSPERO_K8S_NAMESPACE (= this release's namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "prospero.fullname" . }}-fleet
  labels:
    {{- include "prospero.labels" . | nindent 4 }}
rules:
  # list/watch → live fleet snapshot; get/create/update/patch (server-side apply)
  # /delete → create and manage tasks (restart/drain delete the CR).
  - apiGroups: ["caliban.caliban-ai.dev"]
    resources: ["calibantasks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["caliban.caliban-ai.dev"]
    resources: ["calibantasks/status"]
    verbs: ["get"]
  # Prospero is the editor of Workspace CRs (the k8s config plane): add/remove
  # workspaces and edit their sources/providers/config. It reads Workspace status
  # to show reconciliation state. It references credential Secrets by name but has
  # NO secrets access — the operator is the only Secret reader.
  - apiGroups: ["caliban.caliban-ai.dev"]
    resources: ["workspaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["caliban.caliban-ai.dev"]
    resources: ["workspaces/status"]
    verbs: ["get"]
  {{- if .Values.secretPicker.enabled }}
  # Optional (default-off): list Secret names so the dashboard can offer a
  # credentialsRef picker. Grants LIST only — never get/read of Secret values.
  # Keep off to hold prospero fully off credential RBAC (least privilege).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "prospero.fullname" . }}-fleet
  labels:
    {{- include "prospero.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "prospero.fullname" . }}-fleet
subjects:
  - kind: ServiceAccount
    name: {{ include "prospero.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
