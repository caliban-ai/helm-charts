{{- if eq .Values.topology "clustered" }}
{{- if not (or .Values.database.existingSecret .Values.database.url) }}
{{- fail "topology=clustered requires database.existingSecret or database.url" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prospero.fullname" . }}
  labels:
    {{- include "prospero.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "prospero.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prospero.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "prospero.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: prosperod
          image: {{ include "prospero.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --addr
            - "0.0.0.0:{{ .Values.service.port }}"
            - --host
            - {{ .Values.host | quote }}
            - --fleet-backend
            - {{ .Values.fleetBackend | quote }}
            - --lease-ttl-secs
            - {{ .Values.leaseTtlSecs | quote }}
            {{- if not .Values.autostart }}
            - --no-autostart
            {{- end }}
          env:
            {{- if eq .Values.fleetBackend "k8s" }}
            - name: PROSPERO_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PROSPERO_K8S_CALIBAND_CA_FILE
              value: /etc/prospero/session-tls/ca.crt
            - name: PROSPERO_K8S_CALIBAND_TOKEN_FILE
              value: /etc/prospero/session-token/{{ .Values.sessionPlane.tokenKey }}
            - name: PROSPERO_K8S_CALIBAND_SERVER_NAME
              value: {{ .Values.sessionPlane.serverName | quote }}
            {{- end }}
            - name: PROSPERO_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROSPERO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "prospero.dbSecretName" . }}
                  key: {{ .Values.database.secretKey }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- if eq .Values.fleetBackend "k8s" }}
          volumeMounts:
            - name: session-tls
              mountPath: /etc/prospero/session-tls
              readOnly: true
            - name: session-token
              mountPath: /etc/prospero/session-token
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if eq .Values.fleetBackend "k8s" }}
      volumes:
        - name: session-tls
          secret:
            secretName: {{ .Values.sessionPlane.tlsSecret }}
        - name: session-token
          secret:
            secretName: {{ .Values.sessionPlane.tokenSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
