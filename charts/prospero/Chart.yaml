apiVersion: v2
name: prospero
description: Prospero control plane (prosperod) + dashboard — part of the caliban-ai system
type: application
version: 0.3.1
appVersion: "0.8.1"   # prosperod built --features k8s (needed for fleetBackend=k8s). v0.8.1 fixes v0.8.0's AgentsSettled condition, which the CRD schema rejected (lastTransitionTime; prospero#234), so terminal phases actually land. v0.8.0 = API authentication (ADR-0010): with no tokens, prosperod REFUSES to bind 0.0.0.0, so set apiAuth.tokensSecret (or apiAuth.insecureNoAuth) or the pod exits at startup; clustered with tokens also needs apiAuth.sessionKeySecret. Also applies the AgentsSettled condition to CalibanTask status (needs the calibantasks/status patch RBAC below and caliban-operator >= 0.5.0 to act on it), optional PROSPERO_INCLUDE_THINKING, and re-attaches a re-spawned same-name task. Still needs caliban-crds >= 0.2.4 for the conditions map-list.
