appVersion: "0.7.0"   # prosperod built --features k8s (needed for fleetBackend=k8s). v0.7.0 = Ollama removed; prospero fills the caliban worker's provider from repo config, so a repo pinned to `ollama` now spawns a worker that fails at startup — migrate it to `openai` + a local `base_url` (keyless when base_url is set). Carries forward v0.6.0's single dashboard served at / (files under /assets/; the /v1 page and /v2 alias 404 — this chart matches on host only, so nothing here changes). Still needs caliban-crds >= 0.2.1 or the API server prunes spec.task.interactive
