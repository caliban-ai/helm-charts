apiVersion: v2
name: prospero
description: Prospero control plane (prosperod) + dashboard — part of the caliban-ai system
type: application
version: 0.3.3
appVersion: "0.9.0"   # prosperod built --features k8s (needed for fleetBackend=k8s). v0.9.0 is purely additive — no new required values, no removed routes — and brings the two things Ariel needs. (1) The fleet-wide event stream `GET /api/fleet/stream` (prospero#219): one SSE connection carrying every agent's events, each with a durable fleet cursor as its SSE `id:`, so a consumer resumes after a drop with no gap and no repeat. ariel >= 0.4.0 watches this INSTEAD of polling, and an 0.8.x prosperod does not serve it at all — the bridge would retry a 404 forever and notify NOTHING — so ROLL THIS CHART BEFORE THE ARIEL ONE. (2) `X-Prospero-On-Behalf-Of` (prospero#251): a client-asserted subject, recorded as `on_behalf_of` beside the authenticated `actor` on every event, which is how a bridge holding one shared token names the person behind a command. Prosperod does not verify it; it is an assertion recorded next to the credential that made it. Carries forward v0.8.x's API authentication (ADR-0010): with no tokens, prosperod REFUSES to bind 0.0.0.0, so apiAuth.tokensSecret (or apiAuth.insecureNoAuth) is still required or the pod exits at startup, and clustered with tokens also needs apiAuth.sessionKeySecret. Also still applies the AgentsSettled condition to CalibanTask status (needs the calibantasks/status patch RBAC below and caliban-operator >= 0.5.0 to act on it), optional PROSPERO_INCLUDE_THINKING, and re-attaches a re-spawned same-name task. Still needs caliban-crds >= 0.2.4 for the conditions map-list.
