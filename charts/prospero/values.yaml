# Generic, cluster-agnostic defaults ONLY.
# Supply environment-specific values (storageClass, ingress, database URL,
# secrets) via a SEPARATE PRIVATE overlay:  helm install ... -f private-values.yaml

# standalone = sqlite on a PVC, single replica (StatefulSet).
# clustered  = external Postgres, N replicas with leased ownership (Deployment).
topology: standalone
replicaCount: 1            # used in clustered mode
image:
  repository: ghcr.io/caliban-ai/prospero   # public image; override at deploy time
  tag: ""                  # defaults to .Chart.AppVersion when unset
  pullPolicy: IfNotPresent
imagePullSecrets: []       # e.g. [{ name: ghcr-pull }] when pulling private images
service:
  type: ClusterIP
  port: 7878               # prosperod REST/SSE/dashboard (corrected from 8088)
host: local                # PROSPERO_HOST fleet identity (NOT the backend — see fleetBackend)
autostart: false           # false ⇒ pass --no-autostart (no caliband in this image)

# Fleet control-plane backend:
#   local — manages caliband over Unix sockets (empty in a container; the default).
#   k8s   — K8sFleet: reads/drives CalibanTask CRs in this namespace so the dashboard
#           shows the operator's agents. Requires a prosperod image built with the
#           k8s feature (>= 0.1.1) and creates a Role granting this chart's
#           ServiceAccount access to calibantasks (below).
fleetBackend: local

# Under fleetBackend=k8s, prospero is the editor of Workspace CRs. By default it
# gets NO Secret access (it references credential Secrets by name; the operator
# is the only Secret reader). Enable this ONLY to let the dashboard offer a
# credentialsRef name-picker — it grants prospero `list` on Secrets (names only,
# never values). Off by default to keep prospero off credential RBAC.
secretPicker:
  enabled: false

# API authentication (prospero >= 0.8.0, ADR-0010). The pod binds 0.0.0.0, so
# prosperod REFUSES TO START unless you configure tokens OR opt out explicitly.
# Reference existing Secrets only; token material never goes in values.
apiAuth:
  # Secret key holding the tokens file: one `<name> <scope> sha256:<hex>` line per
  # token (generate with `prospero token new <name> --scope read|operate|admin`).
  tokensSecret:
    name: ""
    key: tokens
  # Secret key holding the session-cookie HMAC key (>= 32 bytes, e.g.
  # `openssl rand -base64 48`). REQUIRED for topology=clustered with tokens;
  # standalone generates a random key per process (sessions reset on restart).
  sessionKeySecret:
    name: ""
    key: session.key
  insecureNoAuth: false    # true => PROSPERO_INSECURE_NO_AUTH=1 (anyone reaching the pod controls the fleet)
  cookieSecure: false      # true => always mark the session cookie Secure (else only behind X-Forwarded-Proto: https)

persistence:               # standalone only (no toggle: the StatefulSet's PVC is always required)
  storageClass: ""         # "" = cluster default
  size: 1Gi
  accessMode: ReadWriteOnce
database:                  # clustered only
  # Provide the Postgres URL via a pre-created Secret (preferred):
  existingSecret: ""       # Secret name holding the URL
  secretKey: url           # key within that Secret
  # …or inline (creates a Secret; keep out of the public repo — overlay only):
  url: ""
leaseTtlSecs: 30           # clustered lease TTL
env: {}                    # extra raw env (map of name: value)
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Shared identifiers for the session plane (see charts/caliban-system for the
# umbrella source of truth). Declared here too so standalone installs of this
# chart still resolve — Helm auto-merges the parent's `global` when installed
# as a subchart. Consumed only when fleetBackend == "k8s".
global:
  sessionPlane:
    tlsSecret: caliban-session-plane-tls
    tokenSecret: caliban-session-plane-token
    tokenKey: token
    # Serving-cert SAN AND prosperod's TLS SNI — one value so they cannot diverge.
    serverName: caliband
