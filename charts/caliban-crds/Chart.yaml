apiVersion: v2
name: caliban-crds
description: CustomResourceDefinitions for the caliban-ai operator (Workspace + CalibanTask) — installed as their own step
type: application
version: 0.2.6
appVersion: "0.2.6"   # synced to caliban-operator main 8b00e60 (post-v0.6.0, unreleased): additive — Workspace.spec.agentPolicy gains the typed permission settings permissionMode (default|acceptEdits|plan|auto|dontAsk|bypassPermissions), autoAllow and noPermissions (#51, operator ADR 0006 decision 7); CalibanTask.status.resolvedWorkspace carries them too, since it embeds the pinned policy. Safe to install ahead of the operator: v0.6.0 ignores the new fields, so a workspace setting them is neither projected to the agent nor gated until an operator with #51 runs — and the gate is fail-closed, so the effect of upgrading the operator is to start denying an unsupervised policy that lacks agentPolicy.allowUnattended. Carries forward 0.2.5 = CalibanTask.spec.task.permissionPosture (supervised|unattended), status.permissionPosture + a `Posture` printer column, Workspace.spec.agentPolicy.allowUnattended (#80).
