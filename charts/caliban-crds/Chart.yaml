apiVersion: v2
name: caliban-crds
description: CustomResourceDefinitions for the caliban-ai operator (Workspace + CalibanTask) — installed as their own step
type: application
version: 0.2.9
appVersion: "0.2.9"   # synced to caliban-operator main 3bacc58 (post-v0.6.0, unreleased): CalibanTask.spec.state.mode now carries enum [remote, local], so the API server refuses an invalid storage mode on write instead of the operator failing the task at reconcile time (#94) — the same moment permissionPosture already failed. NOT purely additive: a CalibanTask that already stores some other mode value keeps working (the operator still reports it as a Failed task with a message naming the mode) but can no longer be updated until the field is corrected. The cross-field rules stay reconcile-time: remote requires gonzaloEndpoint, local must not set it. Carries forward 0.2.8 = CalibanTask.spec.model.name, a per-task model that overrides the model the resolved Workspace provider names (#52), so a task can pick a model without the Workspace binding a provider for it. Non-empty when set; applied to the pinned resolution, so it cannot change under a running task, and the provider endpoint and credential still apply. prospero needs no change: it already builds SpawnSpec.model from the pinned provider. Safe to install ahead of the operator: v0.6.0 ignores the field. Carries forward 0.2.7 = Workspace.spec.agentPolicy gains the typed extension settings noMcp, noHooks, noSkills, noSubAgent, strictKnownMarketplaces, enabledPlugins, blockedMarketplaces and parallelToolLimit (#87). parallelToolLimit is bounded at minimum 1, because caliban parses it as a non-zero integer and refuses 0 at startup. An empty enabledPlugins list is meaningful and distinct from omitting the field: caliban reads an empty value as "enable no plugins", where unset enables everything it discovers. These settings reduce what an agent can reach rather than granting it unsupervised power, so unlike #51's permission settings they are not gated on agentPolicy.allowUnattended. Safe to install ahead of the operator: v0.6.0 ignores them. Carries forward 0.2.6 = the typed permission settings permissionMode (default|acceptEdits|plan|auto|dontAsk|bypassPermissions), autoAllow and noPermissions (#51, operator ADR 0006 decision 7); CalibanTask.status.resolvedWorkspace carries them too, since it embeds the pinned policy. Safe to install ahead of the operator: v0.6.0 ignores the new fields, so a workspace setting them is neither projected to the agent nor gated until an operator with #51 runs — and the gate is fail-closed, so the effect of upgrading the operator is to start denying an unsupervised policy that lacks agentPolicy.allowUnattended. Carries forward 0.2.5 = CalibanTask.spec.task.permissionPosture (supervised|unattended), status.permissionPosture + a `Posture` printer column, Workspace.spec.agentPolicy.allowUnattended (#80).
