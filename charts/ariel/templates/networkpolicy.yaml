{{- if .Values.networkPolicy.enabled }}
# Ariel has no Service: Discord events arrive over its outbound Gateway
# connection. Deny all ingress except the health port; leave egress open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ariel.fullname" . }}
  labels:
    {{- include "ariel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ariel.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.healthPort }}
{{- end }}
