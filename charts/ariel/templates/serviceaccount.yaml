# A dedicated identity with no API token: arield never talks to the Kubernetes
# API, so it gets no RBAC and no mounted token (ariel ADR 0008).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ariel.fullname" . }}
  labels:
    {{- include "ariel.labels" . | nindent 4 }}
automountServiceAccountToken: false
