apiVersion: v2
name: ariel
description: Ariel chat bridge (arield) — part of the caliban-ai system
type: application
version: 0.1.4
appVersion: "0.4.0"   # arield from caliban-ai/ariel; ghcr.io/caliban-ai/ariel:0.4.0 is published for linux/amd64 + arm64. REQUIRES PROSPEROD >= 0.9.0 — this is a hard prerequisite, not a soft one: v0.4.0 gets every fleet event from prospero's fleet-wide stream `GET /api/fleet/stream` instead of polling `GET /api/fleet` and holding one SSE connection per agent (ariel#55), and an 0.8.x prosperod does not serve that route at all, so arield retries a 404 forever and notifies NOTHING. Roll the prospero chart to >= 0.3.3 first. What it buys: an agent that starts and finishes between two of the old five-second polls used to be missed entirely and is now announced like any other, and one connection replaces one-per-agent. v0.4.0 also names the person behind a chat command — the live message gains a `started by` field — using prospero v0.9's `X-Prospero-On-Behalf-Of` (ariel#59); the person id on the event is resolved to a gonzalo display name, an id with no record shows as it came, and an agent started outside Ariel renders exactly as before. Restart behaviour shifts slightly: the stream opens at `?from=now`, so a running agent gets its fresh live message on its NEXT event rather than immediately — milliseconds for a working agent, but one idle on a permission prompt stays invisible until it does something. No required env changed. Still needs gonzalod >= 0.7.0 (the fleet access-control record kinds) with auth on, and a prosperod API token (prospero.tokenSecret). Carries forward v0.3.0's channel-config reload every ARIEL_CHANNEL_RELOAD_SECS (60 by default, optional, set through `env`), /ariel kill, respawn, channel, configure and invite, and client TLS; in-cluster plain http:// Service URLs remain correct.
