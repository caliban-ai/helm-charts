appVersion: "0.2.0"   # arield from caliban-ai/ariel; ghcr.io/caliban-ai/ariel:0.2.0 is published for linux/amd64 + arm64. v0.2.0 adds /ariel status and /ariel spawn and installs a logger, so a bad credential prints an error naming the variable instead of exiting silently as 0.1.0 did. Needs gonzalod >= 0.7.0 (the fleet access-control record kinds) with auth on, and a prosperod API token when prospero >= 0.8.0 has auth on (prospero.tokenSecret).
