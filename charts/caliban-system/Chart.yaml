apiVersion: v2
name: caliban-system
description: Umbrella chart composing the full caliban-ai system on Kubernetes
type: application
version: 0.3.3
appVersion: "0.1.0"
dependencies:
  - name: caliban-crds
    version: "0.2.0"
    repository: "file://../caliban-crds"
    condition: caliban-crds.enabled
  - name: agent-sandbox
    version: "0.1.0"
    repository: "file://../agent-sandbox"
    condition: agent-sandbox.enabled
  - name: gonzalo
    version: "0.2.0"
    repository: "file://../gonzalo"
    condition: gonzalo.enabled
  - name: prospero
    version: "0.2.3"
    repository: "file://../prospero"
    condition: prospero.enabled
  - name: caliban-operator
    version: "0.2.2"
    repository: "file://../caliban-operator"
    condition: caliban-operator.enabled
