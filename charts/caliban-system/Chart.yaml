apiVersion: v2
name: caliban-system
description: Umbrella chart composing the full caliban-ai system on Kubernetes
type: application
version: 0.7.16
appVersion: "0.1.0"
dependencies:
  - name: caliban-crds
    version: "0.2.9"
    repository: "file://../caliban-crds"
    condition: caliban-crds.enabled
  # 0.1.1 => agent-sandbox v1.0.5. v1.0.0 removed the v1alpha1 API, the conversion
  # webhook and its TLS certs, so the chart no longer ships the webhook Service or
  # the Role/RoleBinding that let the controller manage its own cert Secret. The
  # apiserver rejects the CRD upgrade unless every Sandbox CRD already reports only
  # v1beta1 in status.storedVersions — see the chart README before upgrading a
  # cluster that predates v0.5.x.
  - name: agent-sandbox
    version: "0.1.1"
    repository: "file://../agent-sandbox"
    condition: agent-sandbox.enabled
  - name: gonzalo
    version: "0.3.1"
    repository: "file://../gonzalo"
    condition: gonzalo.enabled
  # 0.3.3 => prosperod 0.9.0, which adds the fleet-wide event stream
  # `GET /api/fleet/stream` and the `X-Prospero-On-Behalf-Of` subject header.
  # Both are what ariel >= 0.4.0 needs: an 0.8.x prosperod does not serve the
  # stream at all, so the bridge would retry a 404 forever and notify nothing.
  # Raise this before raising the ariel dependency below.
  - name: prospero
    version: "0.3.3"
    repository: "file://../prospero"
    condition: prospero.enabled
  - name: caliban-operator
    version: "0.2.10"
    repository: "file://../caliban-operator"
    condition: caliban-operator.enabled
  # 0.1.4 => arield 0.4.0, which reads every fleet event from prospero's
  # fleet-wide stream instead of polling, and names the person behind a chat
  # command. It REQUIRES prosperod >= 0.9.0 (the prospero dependency above at
  # >= 0.3.3): an 0.8.x daemon does not serve `GET /api/fleet/stream` at all,
  # so arield would retry a 404 forever and notify nothing.
  - name: ariel
    version: "0.1.4"
    repository: "file://../ariel"
    condition: ariel.enabled
