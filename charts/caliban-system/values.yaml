# Umbrella composition for the caliban-ai system.
#
# agent-sandbox is BUNDLED as a default-on subchart (our preferred install of the
# cluster prerequisite). Set `agent-sandbox.enabled: false` to omit it and bring
# your own agent-sandbox install (BYO) — see the repo README.
#
# Subcharts inherit the cluster-agnostic rule: this file ships only generic,
# public defaults. Supply environment-specific values (storageClass, ingress,
# resources, database URL, secrets) via a SEPARATE PRIVATE overlay at deploy time:
#   helm install caliban-system charts/caliban-system -f private-values.yaml

# agent-sandbox (kubernetes-sigs/agent-sandbox v0.5.0) — the Sandbox CRDs +
# controller the operator composes. Default ON. Disable to BYO an existing install.
agent-sandbox:
  enabled: true
  # image.tag defaults to v0.5.0 (pinned in the subchart); override to upgrade.
  # Enable the SandboxTemplate/SandboxClaim/SandboxWarmPool controllers (epic P4):
  # controller:
  #   extensions: true

gonzalo:
  enabled: true
  image:
    repository: ghcr.io/caliban-ai/gonzalo   # public image; tag defaults to the chart's appVersion

prospero:
  enabled: true
  image:
    repository: ghcr.io/caliban-ai/prospero   # public image; tag defaults to the chart's appVersion
  # topology defaults to "standalone" (sqlite + PVC, single replica). For HA,
  # set prospero.topology=clustered + prospero.database.existingSecret in your overlay.

# CalibanTask CRD, installed as its own step. Enable together with the operator
# (the operator is useless without its CRD). Kept OFF by default so the umbrella
# deploys the ready tiers (gonzalo + prospero) without requiring the operator stack.
caliban-crds:
  enabled: false

# The caliban-operator chart is now real (reconciles CalibanTask → sandboxed
# caliband pods). Kept OFF by default until agent-sandbox is bundled (helm-charts#6)
# and the operator image is published — enabling it also requires caliban-crds.enabled=true.
caliban-operator:
  enabled: false

# Shared caliband session-plane credentials (bearer token + TLS serving cert).
# Consumed by caliban-operator (mounted into caliband pods) and prospero (dialer).
# Enable when the caliban-operator / k8s fleet is in use; requires cert-manager.
sessionPlane:
  enabled: false

# Shared identifiers for the session plane, consumed identically by
# caliban-system, caliban-operator, and prospero (single source of truth so
# the serving cert's SAN and prosperod's TLS SNI cannot drift apart).
global:
  sessionPlane:
    tlsSecret: caliban-session-plane-tls
    tokenSecret: caliban-session-plane-token
    tokenKey: token
    # Serving-cert SAN AND prosperod's TLS SNI — one value so they cannot diverge.
    serverName: caliband
