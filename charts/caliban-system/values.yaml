# Umbrella composition for the caliban-ai system.
#
# agent-sandbox is a CLUSTER PREREQUISITE installed separately (see repo README) —
# it is NOT a chart dependency here.
#
# Subcharts inherit the cluster-agnostic rule: this file ships only generic,
# public defaults. Supply environment-specific values (storageClass, ingress,
# resources, database URL, secrets) via a SEPARATE PRIVATE overlay at deploy time:
#   helm install caliban-system charts/caliban-system -f private-values.yaml

gonzalo:
  enabled: true
  image:
    repository: ghcr.io/caliban-ai/gonzalo   # public image; tag defaults to the chart's appVersion

prospero:
  enabled: true
  image:
    repository: ghcr.io/caliban-ai/prospero   # public image; tag defaults to the chart's appVersion
  # topology defaults to "standalone" (sqlite + PVC, single replica). For HA,
  # set prospero.topology=clustered + prospero.database.existingSecret in your overlay.

# CalibanTask CRD, installed as its own step. Enable together with the operator
# (the operator is useless without its CRD). Kept OFF by default so the umbrella
# deploys the ready tiers (gonzalo + prospero) without requiring the operator stack.
caliban-crds:
  enabled: false

# The caliban-operator chart is now real (reconciles CalibanTask → sandboxed
# caliband pods). Kept OFF by default until agent-sandbox is bundled (helm-charts#6)
# and the operator image is published — enabling it also requires caliban-crds.enabled=true.
caliban-operator:
  enabled: false
